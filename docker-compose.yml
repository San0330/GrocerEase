services:

  # ── GrocerEase API ──────────────────────────────────────────────────────────
  grocerease.api:
    # Build the image from the Dockerfile in the current directory
    build:
      context: .           # root of the solution (where Dockerfile lives)
      dockerfile: Dockerfile

    # Name the running container
    container_name: grocerease-api

    # Map host port 5000 → container port 8080 (access via http://localhost:5000)
    ports:
      - "5000:8080"

    # Set environment variables inside the container
    environment:
      # Production keeps the OpenAPI document and development-only behaviour off. Run the API locally for those.
      - ASPNETCORE_ENVIRONMENT=Production
      # ${VAR:?message} makes compose stop with that message when VAR is missing.
      # The values come from the gitignored .env file next to this one (see .env.example).
      # The API connects as grocerease_app, a role without superuser rights that owns this one database
      # (created by grocerease.db-init below). The postgres superuser is only for setup and administration.
      - ConnectionStrings__DefaultConnection=Host=grocerease.db;Port=5432;Database=GrocerEaseDb;Username=grocerease_app;Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD is not set - copy .env.example to .env}
      - JwtSettings__Secret=${JWT_SECRET:?JWT_SECRET is not set - copy .env.example to .env}
      - JwtSettings__Issuer=GrocerEase
      - JwtSettings__Audience=GrocerEase
      - JwtSettings__ExpiryMinutes=60
      # Create or update the tables when the API starts. Safe because compose waits for a healthy database.
      - Database__MigrateOnStartup=true
      # Send traces, metrics and logs to the dashboard below. Remove this line to export nothing: telemetry is optional,
      # the API does not wait for the dashboard, and an unreachable one never affects a request.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grocerease.telemetry:18889

    # Restart the container automatically if it crashes
    restart: on-failure

    # The aspnet image has no curl, so the check opens a socket from bash and reads the status line of /health/ready.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Wait for the database to be healthy, and for the app role to exist and own it, before starting the API
    depends_on:
      grocerease.db:
        condition: service_healthy
      grocerease.db-init:
        condition: service_completed_successfully

  # ── App role setup (runs once per `up`, then exits) ─────────────────────────
  # Creates the non-superuser role the API uses. It is a service rather than a script in
  # /docker-entrypoint-initdb.d because Postgres runs those only when the data volume is empty, and this must also
  # reach a volume that already holds data. The SQL is safe to repeat, so running it on every start is harmless.
  grocerease.db-init:
    image: postgres:16

    container_name: grocerease-db-init

    # Connects as the superuser; psql reads the PG* variables.
    environment:
      PGHOST: grocerease.db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}
      PGDATABASE: GrocerEaseDb
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is not set - copy .env.example to .env}

    volumes:
      - ./docker/postgres/init-app-role.sql:/init-app-role.sql:ro

    # $$ hands the variable to the shell inside the container instead of having compose substitute it here.
    entrypoint: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -v app_password=\"$$APP_DB_PASSWORD\" -f /init-app-role.sql"]

    # A failed setup should stop the API from starting, not be retried forever
    restart: "no"

    depends_on:
      grocerease.db:
        condition: service_healthy

  # ── Telemetry dashboard ─────────────────────────────────────────────────────
  # The .NET Aspire Dashboard: receives the API's traces, metrics and logs over OTLP and shows them in a browser at
  # http://localhost:18888. It keeps everything in memory, so a restart empties it. It is a development tool, not a
  # production backend.
  grocerease.telemetry:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2

    container_name: grocerease-telemetry

    # The browser UI, on the loopback interface only, like Postgres. It is started without a login (see below), so it
    # must not be reachable from other machines. The OTLP port (18889) is deliberately not published: the API reaches it
    # over the compose network, and nothing else needs to.
    ports:
      - "127.0.0.1:18888:18888"

    environment:
      # No login token for the UI, and no API key on the OTLP port. Safe only because of the loopback mapping above and
      # the unpublished OTLP port. Remove both lines to have the dashboard print a login token in its log instead.
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured

    restart: on-failure

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  grocerease.db:
    # Use the official PostgreSQL image
    image: postgres:16

    container_name: grocerease-db

    # Postgres configuration via environment variables
    environment:
      POSTGRES_DB: GrocerEaseDb        # name of the database to create
      POSTGRES_USER: postgres          # superuser login
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}   # superuser password, from .env

    # Map host port 5432 → container port 5432, on the loopback interface only (connect via localhost:5432).
    # A bare "5432:5432" listens on every host interface, which exposes the superuser login to the whole network.
    # The API reaches the database over the compose network, so it does not need this mapping at all.
    ports:
      - "127.0.0.1:5432:5432"

    # Persist database data across container restarts using a named volume
    volumes:
      - grocerease-db-data:/var/lib/postgresql/data

    # Health check — docker-compose waits until Postgres is ready before starting the API
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s    # check every 5 seconds
      timeout: 5s     # fail if no response within 5 seconds
      retries: 5      # retry up to 5 times before marking unhealthy

    restart: on-failure

# ── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  grocerease-db-data:
    # Docker manages this volume — data survives container restarts and removals
