version: 2
updates:
  # The Dockerfile pins its base images by digest, so a new digest needs a pull request to land.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Workflow actions are pinned by commit SHA for the same reason.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The ASP.NET Core and EF Core packages share one AspNetCoreVersion, so they move as one pull request.
  # Dependabot only partly regenerates the lock files, so a bump that fails locked-mode restore (NU1004) needs
  # `dotnet restore --force-evaluate` run by hand and the lock files committed.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
