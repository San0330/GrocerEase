name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The tests need to read the code and nothing else.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Locked mode fails if a lock file no longer matches the projects, instead of quietly restoring something else.
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test --configuration Release --no-build
          --filter "FullyQualifiedName!~IntegrationTests"
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      # ubuntu-latest has Docker, which Testcontainers uses to start Postgres 16.
      - name: Integration tests
        run: >
          dotnet test --configuration Release --no-build
          --filter "FullyQualifiedName~IntegrationTests"
          --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
