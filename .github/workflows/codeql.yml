name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # New queries are published without any push, so the code is also analysed weekly.
  schedule:
    - cron: "41 5 * * 2"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Uploads the results to the Security tab.
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          # A manual build is the one CodeQL can follow exactly, in locked mode like every other build here.
          build-mode: manual
          queries: security-extended

      - name: Build
        run: |
          dotnet restore --locked-mode
          dotnet build --configuration Release --no-restore --no-incremental

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:csharp"
